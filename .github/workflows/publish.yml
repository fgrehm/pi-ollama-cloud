name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read

jobs:
  await-tests:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for a green Test run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            status=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "Test")] | .[0] | "\(.status) \(.conclusion // "")"' || true)
            case "$status" in
              "completed success") echo "Test is green on $SHA"; exit 0 ;;
              "completed "*)       echo "Test did not pass on $SHA ($status)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the Test workflow on $SHA"
          exit 1

  smoke:
    needs: await-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Smoke test
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: pi --extension ./index.ts --model "ollama-cloud/gemma4:31b" --no-tools -p "Say hi in one word"

  publish:
    needs: [await-tests, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC / trusted publishing
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
