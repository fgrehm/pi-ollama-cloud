name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Basic smoke test
        if: env.HAS_API_KEY == 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: pi --no-extensions --no-skills --no-prompt-templates --no-themes --no-context-files --no-session -e ./index.ts --model "ollama-cloud/gemma4:31b" --no-tools -p "Say hi in one word"

      - name: Thinking off (no reasoning)
        if: env.HAS_API_KEY == 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          output=$(pi --no-extensions --no-skills --no-prompt-templates --no-themes --no-context-files --no-session -e ./index.ts --thinking off --model "ollama-cloud/glm-5.2" --no-tools --mode json -p 'hi' 2>&1) || { echo "FAIL: pi exited with $?"; exit 1; }
          if echo "$output" | grep -qE '"type"\s*:\s*"thinking"'; then
            echo "FAIL: thinking block found when off"
            exit 1
          fi
          echo "PASS: no thinking block when off"

      - name: Web tools smoke
        if: env.HAS_API_KEY == 'true'
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: npm run smoke:web-tools

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Smoke test
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: pi --extension ./index.ts --model "ollama-cloud/gemma4:31b" --no-tools -p "Say hi in one word"

  publish:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC / trusted publishing
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
