name: Generate limits

on:
  schedule:
    # Weekly: Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Probing chat completions requires an API key; skip when none is configured.
    if: ${{ secrets.OLLAMA_CLOUD_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Probe limits
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: npm run generate-limits

      - name: Open PR when limits changed
        run: |
          if git diff --exit-code limits.generated.ts > /dev/null; then
            echo "No limit changes."
            exit 0
          fi
          branch="ci/update-limits-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add limits.generated.ts
          git commit -m "chore: refresh probed max output tokens"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh probed max output tokens" \
            --body "Automated refresh of \`limits.generated.ts\` from the live API."
